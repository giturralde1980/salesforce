name: Regression Tests

# DISABLED until 2026-04-01 — suspended to save GitHub Actions minutes
on:
  workflow_dispatch:   # manual only while disabled

jobs:
  regression:
    name: Run Price simulation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps msedge

      - name: Run regression tests
        run: npx playwright test --grep @regression
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_EMAIL_OWNER: ${{ secrets.TEST_EMAIL_OWNER }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_PASSWORD_OWNER: ${{ secrets.TEST_PASSWORD_OWNER }}
          PRODUCT_CODE: ${{ secrets.PRODUCT_CODE }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpellaRegressionTestReport
          path: playwright-report/
          retention-days: 1
