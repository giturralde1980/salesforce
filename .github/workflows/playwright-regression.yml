name: Playwright Regression Tests

on:
  push:
    branches:
      - '**'   # cualquier rama

  repository_dispatch:
    types: [jira-test-execution]  # ← añade esto

jobs:
  regression:
    name: Run @regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps msedge

      - name: Run regression tests
        run: npx playwright test --grep @smoke
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_EMAIL_OWNER: ${{ secrets.TEST_EMAIL_OWNER }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_PASSWORD_OWNER: ${{ secrets.TEST_PASSWORD_OWNER }}
          PRODUCT_CODE: ${{ secrets.PRODUCT_CODE }}

      - name: Run tests from Jira
        run: npx playwright test --grep "@CHCCRM01-18649"
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_EMAIL_OWNER: ${{ secrets.TEST_EMAIL_OWNER }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          TEST_PASSWORD_OWNER: ${{ secrets.TEST_PASSWORD_OWNER }}
          PRODUCT_CODE: ${{ secrets.PRODUCT_CODE }}

      - name: Upload test report
        if: always()   # sube el reporte aunque fallen los tests
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 15
